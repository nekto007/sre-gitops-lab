apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nekto007/sre-gitops-lab.git
    targetRevision: master
    path: apps/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
