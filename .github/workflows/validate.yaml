name: Validate manifests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: YAML and JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install validators
        run: python -m pip install yamllint==1.38.0 PyYAML==6.0.3

      - name: Validate YAML
        run: yamllint -c .yamllint.yaml .github apps bootstrap .yamllint.yaml

      - name: Validate dashboard JSON
        run: |
          for file in dashboards/*.json; do
            python -m json.tool "$file" > /dev/null
          done
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Validate Applications and render Helm charts
        run: python scripts/validate_manifests.py
