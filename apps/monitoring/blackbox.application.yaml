apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 11.20.0
    helm:
      valuesObject:
        fullnameOverride: blackbox

        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      
        config:
          modules:
            llt_health:
              prober: http
              timeout: 5s
              http:
                method: GET
                preferred_ip_protocol: ip4
                valid_status_codes: [200]
                fail_if_not_ssl: true
                fail_if_body_not_matches_regexp:
                  - '"status"\s*:\s*"ok"'
                  - '"db"\s*:\s*"ok"'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreteNamespace=true
