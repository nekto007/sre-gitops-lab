apiVersion: argoproj.io/v1alpha1
king: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
 
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.36.1
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-ppushgateway:
          enabled: false

        server:
          fullnameOverride: prometheus
          retention: 7d
          retentionSize: 1GB
          persistentVolume:
            enabled: true
            size: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          limits:
            memory: 768Mi

        extraScrapeConfigs: |
          - job_name: llt-health
            scrape_interval: 60s
            scrape_timeout: 10s
            metrics_path: /probe
            params:
              module: [llt_health]
            static_configs:
              - targets:
                  https://llt-english.com/health
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target__
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacenet: blackbox.monitoring.svc.cluster.local:9115
destination:
  server: https://kubernetes.default.svc
  namespace: monitoring

syncPolicy:
  syncOptions:
    - CreateNamespace=true  
