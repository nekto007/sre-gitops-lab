apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
 
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.36.1
    helm:
      valuesObject:
        alertmanager:
          enabled: true
          fullnameOverride: alertmanager

          persistence:
            enabled: true
            size: 50Mi
          
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          
          extraSecretMounts:
            - name: telegram-token
              mountPath: /etc/alertmanager/telegram
              secretName: alertmanager-telegram
              readOnly: true

          config:
            enabled: true
            route:
              receiver: telegram
              group_by: [alertname, instance]
              group_wait: 15s
              group_interval: 1m
              repeat_interval: 4h
            receivers:
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/telegram/bot-token
                    chat_id: 6885580
                    send_resolved: true

        serverFiles:
          alerting_rules.yml:
            groups:
              - name: llt-external-health
                rules:
                  - alert: LLTHealthCheckFailed
                    expr: probe_success{job="llt-health"} == 0
                    for: 3m
                    labels:
                      severity: critical
                    annotations:
                      summary: "LLT health check is failing"
                      description: "The HTTPS health check has failed for at least 3 minutes. Check Http status, TLS, response body and database connectivity."
                  - alert: LLTMonitoringDataMissing
                    expr: up{job="llt-health"} == 0 or absent(up{job="llt-health"}) or absent(probe_success{job="llt-health"})
                    for: 3m
                    labels:
                      severity: warning
                    annotations:
                      summary: "LLT monitoring results are unavailable"
                      description: "Prometheus cannot collect probe results or the expected metrics are missing. Website availability is unknown."
                  
                  - alert: LLTCertificateExpiring
                    expr: (probe_ssl_earliest_cert_expiry{job="llt-health"} - time()) / 86400 < 14
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "LLT TLS certificate expires in less than 14 days"
                      description: "Check certificate renewal and the certificate served by the public endpoint."
                  
        server:
          fullnameOverride: prometheus
          retention: 7d
          retentionSize: 1GB
          
          persistentVolume:
            enabled: true
            size: 2Gi
    
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi

          alertmanagers:
            - static_configs:
                - targets:
                    - alertmanager.monitoring.svc.cluster.local:9093
        
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false

        extraScrapeConfigs: |
          - job_name: llt-health
            scrape_interval: 60s
            scrape_timeout: 10s
            metrics_path: /probe
            params:
              module: [llt_health]
            static_configs:
              - targets:
                  - https://llt-english.com/health
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox.monitoring.svc.cluster.local:9115

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true  
